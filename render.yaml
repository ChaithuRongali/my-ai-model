# My AI - free deployment on Render.
# Render reads this file when you choose "New + -> Blueprint".
services:
  - type: web
    name: my-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pasted securely in Render's dashboard. Never stored in this repo.
      - key: OPENAI_API_KEY
        sync: false
      # Groq's free OpenAI-compatible API endpoint.
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b
